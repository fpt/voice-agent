# Gallium / local backend (default)
#
# voice-agent is an app-server client: it spawns a backend agent and drives it a
# turn at a time. This config selects `gallium`, the standalone pure-Rust agent
# (from ../rs-gallium) with the native candle + llama.cpp local engines. It must
# be on PATH. The `llm:` fields below are forwarded to it as environment; the
# backend runs the ReAct loop, tools, and MCP.
#
#   voice-agent --config configs/gallium.yaml        # gallium on PATH runs the model

# The backend program on PATH. `VOICE_AGENT_BACKEND` overrides this at runtime;
# omitting both falls back to `gallium`.
backend: "gallium"

llm:
  modelPath: "hf:LiquidAI/LFM2.5-8B-A1B-GGUF/LFM2.5-8B-A1B-Q4_K_M.gguf"
  # baseURL / apiKey: omitted — this is a local model, so there is no endpoint
  # or credential to send. (They used to be `""`, which the backend then had to
  # special-case so an empty string did not shadow its own default.)
  temperature: 0.3
  maxTokens: 4096

  # The backend's local inference engine: "llamacpp" (in-process llama.cpp) or
  # "gallium" (native pure-Rust candle). Forwarded to the backend as
  # INFERENCE_ENGINE. gallium auto-detects the architecture (gpt-oss / qwen35 /
  # gemma4) from the GGUF metadata (or config.json for safetensors).
  #
  # llamacpp rather than candle for E4B on purpose: candle's dense E4B path has a
  # known degenerate-output bug (docs/REFACTOR.md), and llama.cpp reads the
  # tokenizer from inside the GGUF, so no separate tokenizer repo is needed.
  #
  # Optional env knobs, read by the *backend* (gallium's own names — not
  # VOICE_AGENT_*, and not settable from this file):
  #   GALLIUM_TOKENIZER_REPO  tokenizer.json repo (candle only; E4B's is
  #                           hf:unsloth/gemma-4-E4B-it)
  #   GALLIUM_DTYPE           f16 | bf16 | f32  (safetensors only, default f16)
  #   GALLIUM_THINKING        1 to enable Gemma 4's thinking channel
  inferenceEngine: "llamacpp"

agent:
  systemPromptPath: "system-prompt.md"
  maxTurns: 50
  language: "en"
  skillPaths: ["../skills"]   # SKILL.md dirs (relative to this config's dir)

tts:
  enabled: true
  voice: "com.apple.voice.enhanced.en-US.Zoe"  # com.apple.voice.enhanced.ja-JP.Kyoko for Japanese
  rate: 0.5
  pitchMultiplier: 1.0
  volume: 1.0

stt:
  enabled: true                              # Enable speech-to-text (Apple SpeechTranscriber)
  locale: "en-US"                            # BCP47 locale for transcription
  censor: false                              # Enable etiquette replacements
