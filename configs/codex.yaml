# Codex / cloud backend
#
# voice-agent is an app-server client: it spawns a backend agent and drives it a
# turn at a time. This config selects OpenAI's `codex` app-server:
#
#   voice-agent --config configs/codex.yaml
#
# **codex authenticates itself.** Sign in once with `codex login` (a ChatGPT
# subscription, or an API key) and it uses that; voice-agent passes no
# credentials. `apiKey` below is only read by backends that want
# `OPENAI_API_KEY` in their environment — gallium in cloud mode does, codex
# does not.
#
# The `llm:` fields are forwarded to the backend as environment; the backend
# runs the ReAct loop, tools, and MCP. Every one of them is optional — omit a
# field and the backend's own default applies.

# The backend program on PATH. `VOICE_AGENT_BACKEND` overrides this at runtime;
# omitting both falls back to `gallium`. Any binary speaking the same
# codex-app-server JSON-RPC subset works here.
backend: "codex"

llm:
  # baseURL / apiKey: omitted on purpose — codex uses its own `codex login`
  # credentials and its configured endpoint. Set them only for a backend that
  # reads LLM_BASE_URL / OPENAI_API_KEY (e.g. gallium in cloud mode).
  # model: omitted — codex picks its configured model. Set to override.
  maxTokens: 8192
  reasoningEffort: "medium"             # low | medium | high (reasoning-capable models)

agent:
  systemPromptPath: "system-prompt.md"  # carried into the backend thread as developer instructions
  maxTurns: 50
  language: "en"                        # "en" or "ja" (affects STT, TTS voice selection)
  skillPaths: ["../skills"]             # SKILL.md dirs (relative to this config's dir)

tts:
  enabled: true
  voice: "com.apple.voice.enhanced.en-US.Zoe"  # com.apple.voice.enhanced.ja-JP.Kyoko for Japanese
  rate: 0.5
  pitchMultiplier: 1.0
  volume: 1.0

stt:
  enabled: true                              # Enable speech-to-text (Apple SpeechTranscriber)
  locale: "en-US"                            # BCP47 locale for transcription
  censor: false                              # Enable etiquette replacements
